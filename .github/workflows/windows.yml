name: Windows 11 build

on:
  push:
    branches: [windows-11]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run win:doctor

      - name: Verify Windows runtime APIs
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName UIAutomationClient
          $secure = ConvertTo-SecureString "bops-dpapi-smoke" -AsPlainText -Force
          $sealed = ConvertFrom-SecureString $secure
          $openedSecure = ConvertTo-SecureString $sealed
          $ptr = [Runtime.InteropServices.Marshal]::SecureStringToBSTR($openedSecure)
          try { $opened = [Runtime.InteropServices.Marshal]::PtrToStringBSTR($ptr) } finally { [Runtime.InteropServices.Marshal]::ZeroFreeBSTR($ptr) }
          if ($opened -ne "bops-dpapi-smoke") { throw "DPAPI-backed SecureString round-trip failed" }

      - run: npm run build

      - name: Build Windows installer and portable EXE
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Smoke-test packaged Windows app
        shell: powershell
        run: |
          $portable = Get-ChildItem "dist-desktop\Bops *.exe" | Where-Object { $_.Name -notlike "*Setup*" } | Select-Object -First 1
          if (-not $portable) { throw "Portable EXE was not produced" }
          $process = Start-Process -FilePath $portable.FullName -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:3210/api/health" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) { throw "Packaged Bops did not become healthy on port 3210" }
            $windows = Invoke-RestMethod "http://127.0.0.1:3210/api/mac/windows?all=1" -TimeoutSec 15
            if ($null -eq $windows.windows) { throw "Packaged Win32 window enumeration API did not return a windows collection" }
          } finally {
            Get-Process Bops -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Create SHA256 checksums
        shell: powershell
        run: |
          Get-ChildItem "dist-desktop\*.exe" |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content "dist-desktop\SHA256SUMS.txt"

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: Bops-Windows-11-x64
          path: |
            dist-desktop/*.exe
            dist-desktop/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
