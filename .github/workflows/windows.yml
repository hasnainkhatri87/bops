name: Windows 11 build

on:
  push:
    branches: [windows-11]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run win:doctor
      - run: npm run build
      - name: Package Windows app
        run: npx electron-builder --win --dir --x64
